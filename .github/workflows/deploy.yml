name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: corelab-homepage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: corelab-homepage/package-lock.json

      - run: npm ci

      # 학교 커스텀 도메인(public/CNAME 파일)이 있으면 사이트 주소를 "/"로,
      # 없으면 지금까지처럼 "/저장소이름/"으로 빌드합니다. (자동 감지, 수동 수정 불필요)
      - name: Determine base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: corelab-homepage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
