<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages는 정적 호스팅이라 "/news"처럼 깔끔한 주소로 직접 들어오거나 새로고침하면
      원래는 404가 떠야 하는데, public/404.html이 실제 주소를 숨겨서 이 페이지로 돌려보내면
      아래 스크립트가 주소창을 원래 주소로 되돌려 놓습니다. (다른 사람이 만든 잘 알려진 방법:
      https://github.com/rafgraph/spa-github-pages)
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <!-- 방문 주소 끝에 붙는 _v=... (옛날 화면을 새 화면으로 바꿀 때 자동으로 붙는 표시)는 주소창에서 지웁니다. -->
    <script>
      ;(function (l) {
        if (/[?&]_v=/.test(l.search)) {
          var s = l.search.replace(/([?&])_v=[^&]*&?/, '$1').replace(/[?&]$/, '')
          window.history.replaceState(null, null, l.pathname + s + l.hash)
        }
      })(window.location)
    </script>
    <meta http-equiv="Cache-Control" content="no-cache" />
    <!-- 탭 아이콘: CoRe 로고의 "Co" + o 위의 학습자 (SVG를 쓰는 브라우저 / 그 외는 PNG·ICO) -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%images/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/logo.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="theme-color" content="#00462a" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>CoRe Lab | Ewha Womans University</title>
    <meta
      name="description"
      content="이화여자대학교 교육공학과 임규연 교수 연구실 CoRe Lab — 협력학습(CSCL), 학습분석학, 협력적 문제해결을 연구합니다. Seeing How We Learn Together."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%" />

    <!-- 검색엔진이 이 사이트를 하나의 기관(연구실)으로 이해하도록 돕는 구조화 데이터 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ResearchOrganization",
        "name": "CoRe Lab",
        "alternateName": "이화여자대학교 교육공학과 임규연 교수 연구실",
        "url": "%SITE_URL%",
        "logo": "%SITE_URL%images/logo.svg",
        "description": "협력학습(CSCL), 학습분석학, 협력적 문제해결을 연구하는 이화여자대학교 교육공학과 연구실입니다.",
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "이화여자대학교 (Ewha Womans University)"
        }
      }
    </script>

    <!-- 링크 공유 미리보기 (카카오톡 · 페이스북 · 슬랙 · 문자 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoRe Lab" />
    <meta property="og:locale" content="ko_KR" />

    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CoRe Lab — Seeing How We Learn Together" />

    <meta name="twitter:image" content="%SITE_URL%images/og-image.png?v=%BUILD_ID%" />
