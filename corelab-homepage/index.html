    <!--
      GitHub Pages는 정적 호스팅이라 "/news"처럼 깔끔한 주소로 직접 들어오거나 새로고침하면
      원래는 404가 떠야 하는데, public/404.html이 실제 주소를 숨겨서 이 페이지로 돌려보내면
      아래 스크립트가 주소창을 원래 주소로 되돌려 놓습니다. (다른 사람이 만든 잘 알려진 방법:
      https://github.com/rafgraph/spa-github-pages)
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <!-- 방문 주소 끝에 붙는 _v=... (옛날 화면을 새 화면으로 바꿀 때 자동으로 붙는 표시)는 주소창에서 지웁니다. -->
    <script>
      ;(function (l) {
        if (/[?&]_v=/.test(l.search)) {
          var s = l.search.replace(/([?&])_v=[^&]*&?/, '$1').replace(/[?&]$/, '')
          window.history.replaceState(null, null, l.pathname + s + l.hash)
        }
      })(window.location)
    </script>

      <h1>CoRe Lab(코어랩) — 이화여자대학교 교육공학과 임규연 교수 연구실</h1>
      <p>CoRe Lab(Collaborative Learning Research Lab)은 이화여자대학교(이화여대·이대) 사범대학 교육공학과(교공) 임규연 교수 연구실입니다. Exploring How We Learn Together — 함께 배우는 과정을 들여다봅니다. 협력학습(CSCL), 학습분석학, 협력적 문제해결, 자기조절학습, 학습경험설계(LXD)를 연구합니다.</p>
      <p>교육공학 분야에서 AI를 교육에 활용하는 연구(AI 교육)를 하고 있으며, 교수자-AI 협력 기반 교수지원 체제 설계, 책임 있는 AI의 교육적 활용 등을 다룹니다. 문제해결 학습을 지원하는 기술로 교육 특허도 등록했습니다. 이대 교육공학 석·박사 과정 진학에 관심 있는 분들을 위한 연구실 소식과 연구 성과도 이곳에서 볼 수 있습니다.</p>
